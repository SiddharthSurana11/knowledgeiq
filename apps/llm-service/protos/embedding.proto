syntax = "proto3";

package embedding;

// --------- Existing definitions ---------
message HandleUploadRequest {
  string temp_path = 1;
  string category = 2;
  string original_name = 3;
}
message HandleUploadResponse {
  string status = 1;
  string final_path = 2;
  string message = 3;
}

// --------- NEW: For live embedding ---------
message GetEmbeddingRequest {
  string text = 1; // The text to embed (user query)
}
message GetEmbeddingResponse {
  repeated float vector = 1; // The embedding array
}

// --------- Existing + new RPCs ---------
service EmbeddingService {
  rpc HandleUpload(HandleUploadRequest) returns (HandleUploadResponse);
  rpc GetEmbedding(GetEmbeddingRequest) returns (GetEmbeddingResponse); // <-- NEW!
}
